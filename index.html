<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ランキング表示</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="controls">
    <select id="yearSelect"></select>
    <select id="monthSelect"></select>
    <button id="searchBtn">検索</button>
  </div>

  <!-- ランキングタイトル -->
  <div id="rankingTitle">
    <span class="yearMonth">2025年8月</span>
  </div>

  <!-- ロード中表示 -->
  <div id="loading">ロード、チュ…♡</div>

  <!-- インデックスタブエリア -->
  <div id="appContainer" style="display:none;">
    <div class="tab-container">
      <button class="tab-btn active" data-target="hanjanRanking">半荘数</button>
      <button class="tab-btn" data-target="totalScoreRanking">総スコア</button>
      <button class="tab-btn" data-target="highestScoreRanking">最高スコア</button>
      <button class="tab-btn" data-target="averageScoreRanking">平均スコア</button>
      <button class="tab-btn" data-target="averageRankRanking">平均着順</button>
    </div>

    <!-- ランキング表示エリア（タブで切り替え） -->
    <div id="rankings">
      <div class="ranking-panel active" id="hanjanRanking">
        <h2>半荘数ランキング</h2>
        <table><tbody></tbody></table>
        <p>※スタッフを除いた結果</p>
      </div>

      <div class="ranking-panel" id="totalScoreRanking">
        <h2>総スコアランキング</h2>
        <table><tbody></tbody></table>
        <p>※該当月のゲーム数が9半荘以下の方とスタッフを除いた結果<br>※同着の場合、半荘数で順位を決定</p>
      </div>

      <div class="ranking-panel" id="highestScoreRanking">
        <h2>最高スコアランキング</h2>
        <table><tbody></tbody></table>
        <p>※該当月のゲーム数が9半荘以下の方とスタッフを除いた結果<br>※同着の場合、半荘数で順位を決定</p>
      </div>

      <div class="ranking-panel" id="averageScoreRanking">
        <h2>平均スコアランキング</h2>
        <table><tbody></tbody></table>
        <p>※該当月のゲーム数が9半荘以下の方とスタッフを除いた結果<br>※同着の場合、半荘数で順位を決定</p>
      </div>

      <div class="ranking-panel" id="averageRankRanking">
        <h2>平均着順ランキング</h2>
        <table><tbody></tbody></table>
        <p>※該当月のゲーム数が9半荘以下の方とスタッフを除いた結果<br>※同着の場合、半荘数で順位を決定</p>
      </div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
